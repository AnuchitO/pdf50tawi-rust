[package]
name = "pdf50tawi"
version = "0.1.0"
edition = "2021"

[lib]
name = "pdf50tawi"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "rest"
path = "src/bin/rest.rs"

[dependencies]
lopdf = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["png", "jpeg"] }
once_cell = "1"
reqwest = { version = "0.12", features = ["blocking"] }
anyhow = "1"
thiserror = "1"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
bytes = "1"
flate2 = "1"
ttf-parser = "0.21"

[dev-dependencies]
tempfile = "3"
